name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Compile all packages
        run: go build ./...

      - name: Build binary
        shell: bash
        run: go build -ldflags "-X main.version=pr-${{ github.event.pull_request.number }}" -o aitutor${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Smoke test
        shell: bash
        run: |
          ./aitutor${{ runner.os == 'Windows' && '.exe' || '' }} --smoke > output.txt
          perl -pe 's/\e[\[\(][?]?[0-9;]*[a-zA-Z~]//g; s/\e[=>]//g; s/\r//g' output.txt > clean.txt
          echo "--- Captured output ---"
          cat clean.txt
          echo "--- Checking content ---"
          grep -q "Beginner" clean.txt
          grep -qi "theory" clean.txt
          grep -q "quit" clean.txt
          echo "All checks passed"
