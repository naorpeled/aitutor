name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Compile all packages
        run: go build ./...

      - name: Build binary
        shell: bash
        run: go build -ldflags "-X main.version=pr-${{ github.event.pull_request.number }}" -o aitutor${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x ./aitutor
          code=0
          timeout 5 script -qec "./aitutor" output.txt || code=$?
          # 124 = timeout killed the process (expected), 0 = clean exit
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Binary exited unexpectedly with code $code"
            exit 1
          fi
          perl -pe 's/\e[\[\(][?]?[0-9;]*[a-zA-Z~]//g; s/\e[=>]//g; s/\r//g' output.txt > clean.txt
          echo "--- Captured output ---"
          cat clean.txt
          echo "--- Checking content ---"
          grep -q "Beginner" clean.txt
          grep -qi "theory" clean.txt
          grep -q "quit" clean.txt
          echo "All checks passed"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x ./aitutor
          script -q output.txt bash -c '
            ./aitutor & PID=$!
            sleep 2
            if ! kill -0 $PID 2>/dev/null; then
              wait $PID
              echo "Binary exited unexpectedly with code $?"
              exit 1
            fi
            sleep 3
            kill $PID 2>/dev/null
            exit 0
          '
          perl -pe 's/\e[\[\(][?]?[0-9;]*[a-zA-Z~]//g; s/\e[=>]//g; s/\r//g' output.txt > clean.txt
          echo "--- Captured output ---"
          cat clean.txt
          echo "--- Checking content ---"
          grep -q "Beginner" clean.txt
          grep -qi "theory" clean.txt
          grep -q "quit" clean.txt
          echo "All checks passed"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Git for Windows bundles winpty which allocates a PTY, letting us
          # capture the Bubbletea TUI output the same way script does on Unix.
          WINPTY="$(cmd //C "where winpty 2>nul")" || WINPTY=""
          if [ -n "$WINPTY" ]; then
            timeout 10 winpty -Xallow-non-tty -Xplain ./aitutor.exe > output.txt 2>&1 || code=$?
            perl -pe 's/\e[\[\(][?]?[0-9;]*[a-zA-Z~]//g; s/\e[=>]//g; s/\r//g' output.txt > clean.txt
            echo "--- Captured output ---"
            cat clean.txt
            echo "--- Checking content ---"
            grep -q "Beginner" clean.txt
            grep -qi "theory" clean.txt
            grep -q "quit" clean.txt
            echo "All checks passed"
          else
            echo "winpty not found, falling back to crash-only check"
            ./aitutor.exe & PID=$!
            sleep 5
            if ! kill -0 $PID 2>/dev/null; then
              echo "Binary exited early"
              exit 1
            fi
            kill $PID 2>/dev/null
            echo "Binary started successfully without crashing"
          fi
